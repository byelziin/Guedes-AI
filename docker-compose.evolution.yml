# Adicione este arquivo ao comando docker compose para subir o serviço Evolution junto com o app:
# docker compose -f docker-compose.yml -f docker-compose.evolution.yml up -d

services:
  evolution-api:
    image: "${EVOLUTION_DOCKER_IMAGE}"
    container_name: bot-cris-evolution
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://user:pass@evolution-db:5432/evolution_db?schema=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_TTL=604800
      - CACHE_LOCAL_ENABLED=false
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy

  evolution-redis:
    image: redis:7-alpine
    container_name: bot-cris-evolution-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evolution-db:
    image: postgres:16-alpine
    container_name: evolution-db
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    volumes:
      - evolution-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d evolution_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolution-db-data:
  evolution-redis-data:

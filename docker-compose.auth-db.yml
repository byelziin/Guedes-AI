services:
  auth-db:
    image: postgres:16-alpine
    container_name: guedes-ai-auth-db
    environment:
      POSTGRES_DB: guedesai
      POSTGRES_USER: guedesai
      POSTGRES_PASSWORD: guedesai
    ports:
      - "5433:5432"
    volumes:
      - guedes-ai-auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guedesai -d guedesai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guedes-ai-auth-db-data:
